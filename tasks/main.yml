---
# tasks file for role_technitium

- name: Check installed packages
  ansible.builtin.package_facts:
    manager: auto
  when: ansible_facts.packages is not defined

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Run pre-flight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Install OS family packages
  ansible.builtin.include_tasks: "os_family/{{ ansible_os_family }}.yml"

# ----------------------------------------------------------------
# Service account and directories
# ----------------------------------------------------------------

- name: Create the Technitium service group
  ansible.builtin.group:
    name: "{{ technitium_service_group }}"
    system: true

- name: Create the Technitium service account
  ansible.builtin.user:
    name: "{{ technitium_service_user }}"
    group: "{{ technitium_service_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ technitium_service_home }}"
    create_home: false
    comment: "Technitium DNS Server"

- name: Create the Technitium configuration directory
  ansible.builtin.file:
    path: "{{ technitium_dns_config }}"
    state: directory
    owner: "{{ technitium_service_user }}"
    group: "{{ technitium_service_group }}"
    mode: '0750'

- name: Create the Technitium installation directory
  ansible.builtin.file:
    path: "{{ technitium_dns_dir }}"
    state: directory
    owner: "{{ technitium_service_user }}"
    group: "{{ technitium_service_group }}"
    mode: '0755'

- name: Create the .NET installation directory
  ansible.builtin.file:
    path: "{{ technitium_dotnet_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

# ----------------------------------------------------------------
# Port 53 ownership
# ----------------------------------------------------------------

- name: Disable the systemd-resolved stub listener
  ansible.builtin.include_tasks: systemd_resolved.yml
  when: technitium_disable_systemd_resolved_stub | bool

- name: Guard the DNS port
  ansible.builtin.include_tasks: port.yml

# ----------------------------------------------------------------
# Runtime and release
# ----------------------------------------------------------------

- name: Install the required .NET runtime
  ansible.builtin.include_tasks: runtime.yml

- name: Install the pinned Technitium release
  ansible.builtin.include_tasks: install.yml

# ----------------------------------------------------------------
# Service
# ----------------------------------------------------------------

- name: Create the systemd unit for Technitium
  ansible.builtin.template:
    src: systemd.service.j2
    dest: /etc/systemd/system/{{ technitium_service_name }}.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - restart technitium

- name: Enable and start the Technitium service
  ansible.builtin.systemd:
    name: "{{ technitium_service_name }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Set the admin credentials from the vault
  ansible.builtin.include_tasks: admin.yml

# ----------------------------------------------------------------
# Host resolution and firewall
# ----------------------------------------------------------------

- name: Point the host resolver at Technitium
  ansible.builtin.include_tasks: resolv.yml
  when: technitium_resolv_conf_managed | bool

- name: Manage the firewall
  ansible.builtin.include_tasks: firewall.yml
  when: technitium_firewall_manage | bool
